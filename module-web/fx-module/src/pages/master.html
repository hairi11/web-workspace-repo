<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master</title>
    <link rel="stylesheet" href="../assets/module-web.css">
</head>
<body data-page="master">
<main>
    <nav>
        <a class="button" href="../index.html">Modules</a>
        <a class="button" href="./enquiry.html">FX Enquiry</a>
    </nav>

    <h1>FX Master</h1>

    <form id="fxMasterForm">
        <section class="card fx-create-summary">
            <div class="form-grid">
                <div class="form-group">
                    <span>Status</span>
                    <div id="masterStatus" class="view-value">-</div>
                </div>
                <div class="form-group">
                    <span>Report Date</span>
                    <div id="masterReportDate" class="view-value">-</div>
                </div>
            </div>
        </section>

        <div class="toolbar fx-create-toolbar">
            <button id="addTransactionButton" type="button">Add Transaction</button>
        </div>

        <div class="table-responsive fx-create-table-wrap">
            <table id="fxMasterTable" class="fx-create-table">
                <caption>FX transactions</caption>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>FX Date</th>
                        <th>Category</th>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Currency</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="masterButtonBar" class="button-bar fx-create-actions">
            <button id="submitButton" type="submit" name="action" value="submit">Submit</button>

            <div id="masterSecondaryActions" class="button-dropdown button-dropdown-split">
                <button id="saveButton" type="submit" name="action" value="save">
                    Save Draft
                </button>
                <button
                    id="masterSecondaryButton"
                    type="button"
                    aria-label="More secondary actions"
                    aria-controls="masterSecondaryMenu"
                    title="More secondary actions"
                >
                    <i class="fa fa-chevron-down" aria-hidden="true"></i>
                </button>

                <div id="masterSecondaryMenu" class="button-dropdown-menu" hidden>
                    <button id="cancelButton" type="button">Cancel</button>
                </div>
            </div>

            <a id="backButton" class="button" href="./enquiry.html">Back</a>
        </div>
    </form>
</main>
<script src="./fx.js"></script>
</body>
</html>
