<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - Address</title>
    <link rel="stylesheet" href="../assets/module-web.css">
</head>
<body data-page="create" data-step="address">
<main>
    <nav>
        <a class="button" href="../index.html">Modules</a>
        <a class="button" href="./enquiry.html">User Enquiry</a>
        <a class="button" href="./create.html">Create User</a>
        <a class="button" href="../todos/enquiry.html">Todos</a>
    </nav>

    <h1>Create User - Address</h1>
    <form id="userForm" novalidate>
        <div class="form-group"><label for="street">Street</label><input id="street" name="street" type="text"></div>
        <div class="form-group"><label for="suite">Suite</label><input id="suite" name="suite" type="text"></div>
        <div class="form-group"><label for="city">City</label><input id="city" name="city" type="text"></div>
        <div class="form-group"><label for="zipcode">Zip Code</label><input id="zipcode" name="zipcode" type="text"></div>
        <div class="form-group"><label for="lat">Latitude</label><input id="lat" name="lat" type="text"></div>
        <div class="form-group"><label for="lng">Longitude</label><input id="lng" name="lng" type="text"></div>
        <div class="form-actions">
            <a class="button" href="./create.html?resume=1">Back</a>
            <button type="submit">Next</button>
            <a class="button" href="./enquiry.html">Cancel</a>
        </div>
    </form>
</main>
<script src="./user.js"></script>
</body>
</html>
