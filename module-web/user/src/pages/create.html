<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - Profile</title>
    <link rel="stylesheet" href="../assets/module-web.css">
</head>
<body data-page="create" data-step="profile">
<main>
    <nav>
        <a class="btn btn-outline-secondary" href="../index.html">Modules</a>
        <a class="btn btn-outline-secondary" href="./enquiry.html">User Enquiry</a>
        <a class="btn btn-outline-secondary" href="./create.html">Create User</a>
        <a class="btn btn-outline-secondary" href="../todos/enquiry.html">Todos</a>
    </nav>

    <h1>Create User - Profile</h1>
    <form id="userForm" novalidate>
        <div class="form-group"><label for="name">Name</label><input id="name" name="name" type="text"></div>
        <div class="form-group"><label for="username">Username</label><input id="username" name="username" type="text"></div>
        <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email"></div>
        <div class="form-group"><label for="phone">Phone</label><input id="phone" name="phone" type="text"></div>
        <div class="form-group"><label for="website">Website</label><input id="website" name="website" type="text"></div>
        <div id="userButtonBar" class="button-bar">
            <button class="btn btn-outline-secondary" id="submitButton" type="submit">Next</button>
            <a id="cancelButton" class="btn btn-outline-secondary" href="./enquiry.html">Cancel</a>
        </div>
    </form>
</main>
<script src="./user.js"></script>
</body>
</html>
