<h1>Update Todo</h1>
<form id="todoForm" novalidate>
    <div class="form-group"><label for="userId">User ID</label><input id="userId" name="userId" type="number" min="1"></div>
    <div class="form-group"><label for="title">Title</label><input id="title" name="title" type="text"></div>
    <div class="form-group">
        <label for="completed">Status</label>
        <select id="completed" name="completed" class="js-select2">
            <option value="false">Pending</option>
            <option value="true">Completed</option>
        </select>
    </div>
    <div class="form-actions">
        <button type="submit">Update</button>
        <a class="button" href="./enquiry.html">Cancel</a>
    </div>
</form>
<h2>Response</h2>
<pre id="resultOutput">-</pre>
